[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcm-mcp-server"
version = "0.3.0"
description = "A FastAPI-based Model Context Protocol (MCP) server for Highway Capacity Manual (HCM) analysis and transportation engineering calculations."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "raynbowy23", email = "tamaru@wisc.edu"},
]

keywords = [
    "fastapi",
    "mcp",
    "transportation",
    "hcm",
    "server",
    "api",
]

dependencies = [
    "faiss-cpu==1.11.0",
    "fastapi==0.116.1",
    "fastapi-mcp==0.3.6",
    "langchain==0.3.26",
    "mcp[cli]==1.11.0",
    "numpy>=2.2.4",
    "pymupdf>=1.26.1",
    "pymupdf4llm>=0.0.25",
    "sentence-transformers==5.0.0",
    "python-dotenv==1.1.1",
    "chromadb==1.0.15",
    "supabase==2.18.0",
    # validate_design_full runs the full rule engine in-process via the ORM
    # model classes — sqlalchemy the library, but no database server / asyncpg.
    "sqlalchemy>=2.0.0",
    # simpleeval is what the validator's rule engine evaluates formula-type rule
    # expressions with. transportations-validator imports it unconditionally from
    # validators/engine.py but declares it only under its `api` and `all` extras,
    # so a base install of the validator cannot import the engine at all. We take
    # those extras deliberately (they pull fastapi, asyncpg, neo4j, uvicorn and
    # the plotting stack, which an in-process no-database deployment has no use
    # for), so the one genuinely needed package is declared here instead.
    #
    # This is compensating for an upstream metadata gap, not a dependency this
    # repo chose: drop it once transportations-validator lists simpleeval among
    # its base requirements. Until 2026-08-19 it was undeclared on both sides and
    # only present in developer venvs by accident, which left
    # validation_validate_design_full a non-functional stub in any clean install.
    "simpleeval>=1.0.0",
    # The reasoning layer (repair/reconcile/inverse/chaining + BasicFreeway), the
    # Chapter 12 tools, and validate_design_full need:
    #   - transportations-validator >=0.3.0 (seed-backed engine + reasoning modules + coverage/abstention on semantic results)
    #   - transportations-library >=0.3.6. The floor moved from 0.2.0 with the
    #     per-method hcm_analyze_* surface: 0.3.6 is the first release exposing
    #     analyze_mixed_flow / analyze_composite_grade / analyze_twsc_pedestrian
    #     and the ManagedLaneFacility, PlanningFacility, AlternativeIntersection
    #     and DisplacedLeftTurn classes to Python. On 0.3.0 those names are
    #     simply absent, so their tools would register as unavailable stubs
    #     rather than fail loudly at import.
    "transportations-validator>=0.3.0",
    "transportations-library>=0.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.9.10",
    "types-setuptools>=75.8.2.20250305",
    "pytest>=8.3.5"
]

# Dev-time: build transportations-library from the sibling checkout so `uv sync`
# always tracks the current library source instead of a published wheel. This is
# what prevents the stale-wheel / version-skew class of bug (a downstream venv
# silently holding an old build). It assumes the repos are checked out as
# siblings (../transportations-library); CI, which checks out only this repo,
# must pass `--no-sources` to ignore this and resolve the pinned version from the
# index instead. transportations-validator stays index-resolved (it is published
# to PyPI at the required version); only the library needs source builds today.
[tool.uv.sources]
transportations-library = { path = "../transportations-library", editable = true }

[project.urls]
Homepage = "https://github.com/crosstraffic/highway-capacity-manual-mcp"
Documentation = "https://crosstraffic.github.io/highway-capacity-manual-mcp/#readme"
"Bug Tracker" = "https://github.com/crosstraffic/highway-capacity-manual-mcp/issues"
"Source Code" = "https://github.com/crosstraffic/highway-capacity-manual-mcp"

[tool.hatch.build.targets.wheel]
packages = ["hcm_mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
