functions:
  analysis:
    analyze_facility:
      module: hcm_mcp_server.functions.analysis
      function: analyze_facility_function
      description: 'Run the complete HCM analysis for one facility: pass facility_type plus its inputs; dispatches to the verified transportations-library executor and returns the full result'
      category: analysis
      parameters:
        type: object
        properties:
          facility_type:
            type: string
            description: Facility type, e.g. BasicFreeway or TwoLaneHighway; call list_facility_types for the full set and status
          inputs:
            type: object
            description: Facility inputs; call describe_facility_inputs for the schema of this facility_type
        required:
        - facility_type
        - inputs
    describe_facility_inputs:
      module: hcm_mcp_server.functions.analysis
      function: describe_facility_inputs_function
      description: 'Describe facility input schemas: with facility_type, the field schema (types, defaults, units) for constructing an analyze_facility request; without it, the list of every library-backed HCM facility type with chapter and adapter status'
      category: analysis
      parameters:
        type: object
        properties:
          facility_type:
            type: string
            description: Facility type to describe; omit to list all facility types with status
        required: []
  research:
    query_hcm:
      module: hcm_mcp_server.functions.research
      function: query_hcm_function
      description: Query the Highway Capacity Manual database
      category: research
      parameters:
        type: object
        properties:
          question:
            type: string
            description: Question to search in HCM database
          top_k:
            type: integer
            description: Number of results to return
            default: 5
        required:
        - question
  reasoning:
    propagate_change:
      module: hcm_mcp_server.functions.reasoning
      function: propagate_change_function
      description: 'Forward-chain: downstream parameters affected by a changed root parameter'
      category: reasoning
      parameters:
        type: object
        properties:
          root:
            type: string
            description: The changed parameter (rust_field) to propagate from
          facility_type:
            type: string
            description: Restrict to a facility (e.g. TwoLaneHighway, BasicFreeway)
        required:
        - root
    diagnose_failure:
      module: hcm_mcp_server.functions.reasoning
      function: diagnose_failure_function
      description: 'Backward-chain: upstream causes of a failed target parameter'
      category: reasoning
      parameters:
        type: object
        properties:
          target:
            type: string
            description: The failing parameter (rust_field) to trace causes for
          facility_type:
            type: string
            description: Restrict to a facility (e.g. TwoLaneHighway, BasicFreeway)
        required:
        - target
    repair_design:
      module: hcm_mcp_server.functions.reasoning
      function: repair_design_function
      description: 'Abductive repair: minimal compliant fix for a failing Two-Lane Highway (HCM Ch.15), every candidate re-executed and proved compliant'
      category: reasoning
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Current design inputs (rust_fields: lane_width, shoulder_width, apd, volume, spl, grade, phv, phf, length, passing_type)'
          goal_los:
            type: string
            description: Target LOS letter — repair goal is 'no worse than this'
            default: C
          immutable:
            type: array
            items:
              type: string
            description: Override which parameters are fixed site conditions
          allow_demand_changes:
            type: boolean
            description: Also consider demand-side levers
            default: false
        required:
        - design
    repair_freeway:
      module: hcm_mcp_server.functions.reasoning
      function: repair_freeway_function
      description: 'Abductive repair: minimal compliant fix for a failing Basic Freeway (HCM Ch.12). Keep grade/length on the library''s heavy-vehicle PCE grid.'
      category: reasoning
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Current design inputs (rust_fields: bffs, lw, lane_count, demand_flow_i, lc_r, trd, grade, length, p_t, phf)'
          goal_los:
            type: string
            description: Target LOS letter — repair goal is 'no worse than this'
            default: D
          immutable:
            type: array
            items:
              type: string
            description: Override which parameters are fixed site conditions
          allow_demand_changes:
            type: boolean
            description: Also consider demand-side levers
            default: false
        required:
        - design
    reconcile_codes:
      module: hcm_mcp_server.functions.reasoning
      function: reconcile_codes_function
      description: Defeasible adjudication of overlapping/conflicting code provisions about one parameter, with an argument trace
      category: reasoning
      parameters:
        type: object
        properties:
          scenario:
            type: string
            description: Name of a constructed conflict scenario (alternative to inline claims)
          claims:
            type: array
            items:
              type: object
            description: Inline competing rule claims (seed-shaped rule dicts)
          parameter:
            type: string
            description: The parameter under contention
          value:
            description: A value to render a compliance verdict for
          context:
            type: object
            description: 'Applicability conditions (e.g. {jurisdiction: state})'
        required: []
    inverse_design:
      module: hcm_mcp_server.functions.reasoning
      function: inverse_design_function
      description: 'Goal-directed synthesis: feasible geometries that reach a target LOS, each validated by forward execution (HCM Ch.15 proof-of-concept)'
      category: reasoning
      parameters:
        type: object
        properties:
          site:
            type: object
            description: Fixed site conditions (demand, grade, speed limit, …)
          goal_los:
            type: string
            description: Target LOS letter
            default: C
          facility_type:
            type: string
            description: Facility type
            default: TwoLaneHighway
          design_parameters:
            type: array
            items:
              type: string
            description: Levers to discover geometry over (auto-discovered if omitted)
          bounds:
            type: object
            description: Override (min, max) bounds per design parameter
        required:
        - site
  validation:
    validate_design_full:
      module: hcm_mcp_server.functions.validation
      function: validate_design_full_function
      description: Validate a design against the FULL rule corpus with citations and clarifications (in-process, no database)
      category: validation
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Flat parameter -> value map, e.g. {lane_width: 9.0, facility_type: TwoLaneHighway}'
          context:
            type: object
            description: 'Optional conditions, e.g. {terrain_type: mountainous, jurisdiction: state}'
        required:
        - design
  hcm:
    analyze:
      module: hcm_mcp_server.functions.methods
      function: analyze_function
      description: |-
        Run one HCM analysis method against the compute library's verified executors. Pass 'method' plus that method's 'config' in the library's example-case (fixture) schema; call hcm_describe for a method's input shape and worked example. Methods:
            analyze_freeway_facility (Ch.10): Freeway facility (Chapter 25 engine)
            analyze_managed_lanes (Ch.10): Managed-lane freeway facility
            analyze_freeway_reliability (Ch.11): Freeway travel-time reliability
            analyze_basic_freeway (Ch.12): Basic freeway and multilane segment
            analyze_weaving (Ch.13): Freeway weaving segment
            analyze_merge_diverge (Ch.14): Freeway merge and diverge segment
            analyze_two_lane_highway (Ch.15): Two-lane highway facility
            analyze_urban_facility (Ch.16): Urban street facility
            analyze_urban_reliability (Ch.17): Urban street travel-time reliability
            analyze_bicycle_segment (Ch.18): Urban street segment, bicycle mode
            analyze_pedestrian_segment (Ch.18): Urban street segment, pedestrian mode
            analyze_transit_segment (Ch.18): Urban street segment, transit mode
            analyze_urban_segment (Ch.18): Urban street segment, automobile mode
            analyze_signalized (Ch.19): Signalized intersection, automobile mode
            analyze_signalized_bicycle (Ch.19): Signalized intersection, bicycle mode
            analyze_signalized_pedestrian (Ch.19): Signalized intersection, pedestrian mode
            analyze_two_stage_crossing (Ch.19): Two-stage pedestrian crossing delay
            analyze_twsc (Ch.20): Two-way STOP-controlled intersection, vehicular
            analyze_twsc_pedestrian (Ch.20): TWSC and midblock crossing, pedestrian mode
            analyze_awsc (Ch.21): All-way STOP-controlled intersection
            analyze_roundabout (Ch.22): Roundabout
            analyze_alternative_intersection (Ch.23): RCUT and MUT alternative intersections (Part C)
            analyze_displaced_left_turn (Ch.23): Displaced left-turn intersection (Part C)
            analyze_ramp_terminal (Ch.23): Interchange ramp terminals (Part B)
            analyze_offstreet_bicycle (Ch.24): Off-street path, bicycle mode
            analyze_pedestrian_walkway (Ch.24): Exclusive pedestrian walkway or stairwell
            analyze_shared_use_path_pedestrian (Ch.24): Shared-use path, pedestrian mode
            analyze_composite_grade (Ch.25): Mixed-flow model, composite grade
            analyze_planning_facility (Ch.25): Planning-level freeway facility
            analyze_mixed_flow (Ch.26): Mixed-flow model, single grade
            analyze_weaving_service_volumes (Ch.27): Weaving segment service volumes
            analyze_ramp_service_volumes (Ch.28): Merge and diverge service volumes
      category: hcm
      parameters:
        type: object
        properties:
          method:
            type: string
            description: Which HCM method to run
            enum:
            - analyze_alternative_intersection
            - analyze_awsc
            - analyze_basic_freeway
            - analyze_bicycle_segment
            - analyze_composite_grade
            - analyze_displaced_left_turn
            - analyze_freeway_facility
            - analyze_freeway_reliability
            - analyze_managed_lanes
            - analyze_merge_diverge
            - analyze_mixed_flow
            - analyze_offstreet_bicycle
            - analyze_pedestrian_segment
            - analyze_pedestrian_walkway
            - analyze_planning_facility
            - analyze_ramp_service_volumes
            - analyze_ramp_terminal
            - analyze_roundabout
            - analyze_shared_use_path_pedestrian
            - analyze_signalized
            - analyze_signalized_bicycle
            - analyze_signalized_pedestrian
            - analyze_transit_segment
            - analyze_two_lane_highway
            - analyze_two_stage_crossing
            - analyze_twsc
            - analyze_twsc_pedestrian
            - analyze_urban_facility
            - analyze_urban_reliability
            - analyze_urban_segment
            - analyze_weaving
            - analyze_weaving_service_volumes
          config:
            type: object
            description: Analysis inputs in that method's HCM example-case (fixture) schema; hcm_describe returns the shape and a worked example
          mode:
            type: string
            description: analyze_urban_facility only - aggregate (default) or analyze
        required:
        - method
        - config
    describe:
      module: hcm_mcp_server.functions.methods
      function: describe_function
      description: 'Discover HCM methods: with a method id, its input schema sketch, its result-field meanings and the example-problem fixture that validates it; with no argument, the catalog of every method with its chapter and a one-line summary'
      category: hcm
      parameters:
        type: object
        properties:
          method:
            type: string
            description: Method id to describe; omit for the full catalog
        required: []
    validate:
      module: hcm_mcp_server.functions.methods
      function: validate_function
      description: 'Parse and validate a method config WITHOUT running the analysis, returning the compute library''s own validation errors or ok. Use this while iterating on a config. A few methods have no validation step separate from the analysis and say so in the response'
      category: hcm
      parameters:
        type: object
        properties:
          method:
            type: string
            description: Which HCM method the config is for
          config:
            type: object
            description: Analysis inputs in that method's HCM example-case (fixture) schema
        required:
        - method
        - config
categories:
  transportation: Transportation analysis and capacity calculations
  research: Documentation search and research functions
  reasoning: 'Graph reasoning over the executable knowledge graph: repair, reconcile, inverse design, chaining'
  validation: Full-corpus rule validation with citations and clarifications, in-process
  utility: General utility and helper functions
  hcm: 'Per-method HCM analysis: one tool per method the compute library implements, taking the library''s own example-case (fixture) JSON schema'
  analysis: 'General facility analysis: one dispatching tool over every library-backed HCM facility, plus discovery tools'
config:
  auto_load_modules: true
  validate_functions: true
  enable_caching: false
