functions:
  analysis:
    analyze_facility:
      module: hcm_mcp_server.functions.analysis
      function: analyze_facility_function
      description: 'Run the complete HCM analysis for one facility: pass facility_type plus its inputs; dispatches to the verified transportations-library executor and returns the full result'
      category: analysis
      parameters:
        type: object
        properties:
          facility_type:
            type: string
            description: Facility type, e.g. BasicFreeway or TwoLaneHighway; call list_facility_types for the full set and status
          inputs:
            type: object
            description: Facility inputs; call describe_facility_inputs for the schema of this facility_type
        required:
        - facility_type
        - inputs
    list_facility_types:
      module: hcm_mcp_server.functions.analysis
      function: list_facility_types_function
      description: List every HCM facility type the compute library can execute, with chapter and adapter status (available vs adapter_pending)
      category: analysis
      parameters:
        type: object
        properties: {}
        required: []
    describe_facility_inputs:
      module: hcm_mcp_server.functions.analysis
      function: describe_facility_inputs_function
      description: Describe the input schema (fields, types, defaults, units in descriptions) for a facility_type so a valid analyze_facility request can be constructed
      category: analysis
      parameters:
        type: object
        properties:
          facility_type:
            type: string
            description: Facility type to describe
        required:
        - facility_type
  research:
    query_hcm:
      module: hcm_mcp_server.functions.research
      function: query_hcm_function
      description: Query the Highway Capacity Manual database
      category: research
      parameters:
        type: object
        properties:
          question:
            type: string
            description: Question to search in HCM database
          top_k:
            type: integer
            description: Number of results to return
            default: 5
        required:
        - question
    search_hcm_by_chapter:
      module: hcm_mcp_server.functions.research
      function: search_hcm_by_chapter_function
      description: Search HCM content by chapter
      category: research
      parameters:
        type: object
        properties:
          chapter:
            type: string
            description: Chapter to search in HCM database
          top_k:
            type: integer
            description: Number of results to return
            default: 5
        required:
        - chapter
    get_hcm_section:
      module: hcm_mcp_server.functions.research
      function: get_hcm_section_function
      description: Retrieve a specific section from the Highway Capacity Manual
      category: research
      parameters:
        type: object
        properties:
          chapter:
            type: string
            description: Chapter to retrieve section from
          section:
            type: string
            description: Section number to retrieve
        required:
        - chapter
    summarize_hcm_content:
      module: hcm_mcp_server.functions.research
      function: summarize_hcm_content_function
      description: Summarize HCM content for a given topic
      category: research
      parameters:
        type: object
        properties:
          topic:
            type: string
            description: Topic to summarize from HCM content
          top_k:
            type: integer
            description: Number of results to return
            default: 5
        required:
        - topic
  reasoning:
    propagate_change:
      module: hcm_mcp_server.functions.reasoning
      function: propagate_change_function
      description: 'Forward-chain: downstream parameters affected by a changed root parameter'
      category: reasoning
      parameters:
        type: object
        properties:
          root:
            type: string
            description: The changed parameter (rust_field) to propagate from
          facility_type:
            type: string
            description: Restrict to a facility (e.g. TwoLaneHighway, BasicFreeway)
        required:
        - root
    diagnose_failure:
      module: hcm_mcp_server.functions.reasoning
      function: diagnose_failure_function
      description: 'Backward-chain: upstream causes of a failed target parameter'
      category: reasoning
      parameters:
        type: object
        properties:
          target:
            type: string
            description: The failing parameter (rust_field) to trace causes for
          facility_type:
            type: string
            description: Restrict to a facility (e.g. TwoLaneHighway, BasicFreeway)
        required:
        - target
    repair_design:
      module: hcm_mcp_server.functions.reasoning
      function: repair_design_function
      description: 'Abductive repair: minimal compliant fix for a failing Two-Lane Highway (HCM Ch.15), every candidate re-executed and proved compliant'
      category: reasoning
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Current design inputs (rust_fields: lane_width, shoulder_width, apd, volume, spl, grade, phv, phf, length, passing_type)'
          goal_los:
            type: string
            description: Target LOS letter — repair goal is 'no worse than this'
            default: C
          immutable:
            type: array
            items:
              type: string
            description: Override which parameters are fixed site conditions
          allow_demand_changes:
            type: boolean
            description: Also consider demand-side levers
            default: false
        required:
        - design
    repair_freeway:
      module: hcm_mcp_server.functions.reasoning
      function: repair_freeway_function
      description: 'Abductive repair: minimal compliant fix for a failing Basic Freeway (HCM Ch.12). Keep grade/length on the library''s heavy-vehicle PCE grid.'
      category: reasoning
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Current design inputs (rust_fields: bffs, lw, lane_count, demand_flow_i, lc_r, trd, grade, length, p_t, phf)'
          goal_los:
            type: string
            description: Target LOS letter — repair goal is 'no worse than this'
            default: D
          immutable:
            type: array
            items:
              type: string
            description: Override which parameters are fixed site conditions
          allow_demand_changes:
            type: boolean
            description: Also consider demand-side levers
            default: false
        required:
        - design
    reconcile_codes:
      module: hcm_mcp_server.functions.reasoning
      function: reconcile_codes_function
      description: Defeasible adjudication of overlapping/conflicting code provisions about one parameter, with an argument trace
      category: reasoning
      parameters:
        type: object
        properties:
          scenario:
            type: string
            description: Name of a constructed conflict scenario (alternative to inline claims)
          claims:
            type: array
            items:
              type: object
            description: Inline competing rule claims (seed-shaped rule dicts)
          parameter:
            type: string
            description: The parameter under contention
          value:
            description: A value to render a compliance verdict for
          context:
            type: object
            description: 'Applicability conditions (e.g. {jurisdiction: state})'
        required: []
    inverse_design:
      module: hcm_mcp_server.functions.reasoning
      function: inverse_design_function
      description: 'Goal-directed synthesis: feasible geometries that reach a target LOS, each validated by forward execution (HCM Ch.15 proof-of-concept)'
      category: reasoning
      parameters:
        type: object
        properties:
          site:
            type: object
            description: Fixed site conditions (demand, grade, speed limit, …)
          goal_los:
            type: string
            description: Target LOS letter
            default: C
          facility_type:
            type: string
            description: Facility type
            default: TwoLaneHighway
          design_parameters:
            type: array
            items:
              type: string
            description: Levers to discover geometry over (auto-discovered if omitted)
          bounds:
            type: object
            description: Override (min, max) bounds per design parameter
        required:
        - site
  validation:
    validate_design_full:
      module: hcm_mcp_server.functions.validation
      function: validate_design_full_function
      description: Validate a design against the FULL rule corpus with citations and clarifications (in-process, no database)
      category: validation
      parameters:
        type: object
        properties:
          design:
            type: object
            description: 'Flat parameter -> value map, e.g. {lane_width: 9.0, facility_type: TwoLaneHighway}'
          context:
            type: object
            description: 'Optional conditions, e.g. {terrain_type: mountainous, jurisdiction: state}'
        required:
        - design
categories:
  transportation: Transportation analysis and capacity calculations
  research: Documentation search and research functions
  reasoning: 'Graph reasoning over the executable knowledge graph: repair, reconcile, inverse design, chaining'
  validation: Full-corpus rule validation with citations and clarifications, in-process
  utility: General utility and helper functions
  analysis: 'General facility analysis: one dispatching tool over every library-backed HCM facility, plus discovery tools'
config:
  auto_load_modules: true
  validate_functions: true
  enable_caching: false
