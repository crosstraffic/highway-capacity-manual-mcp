categories:
  transportation: Transportation analysis and capacity calculations
  research: Documentation search and research functions
  reasoning: 'Graph reasoning over the executable knowledge graph: repair, reconcile, inverse design, chaining'
  validation: Full-corpus rule validation with citations and clarifications, in-process
  utility: General utility and helper functions
  hcm: 'Per-method HCM analysis: one tool per method the compute library implements, taking the library''s own example-case (fixture) JSON schema'
  analysis: 'General facility analysis: one dispatching tool over every library-backed HCM facility, plus discovery tools'
config:
  auto_load_modules: true
  validate_functions: true
  enable_caching: false
