name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ruff:
        name: Ruff
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                version: "0.6.12"
                enable-cache: true
                cache-dependency-glob: "uv.lock"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version-file: ".python-version"
            
            - name: Install dependencies
              # --no-sources ignores [tool.uv.sources] (the local sibling path
              # for transportations-library, which only exists in a full
              # multi-repo checkout) and resolves the pinned version from the
              # index. Requires transportations-library to be published.
              run: uv sync --all-extras --dev --no-sources

            - name: Lint with Ruff
              run: uv run --no-sources ruff check .
              continue-on-error: true
    pytest:
        name: Pytest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                version: "0.6.12"
                enable-cache: true
                cache-dependency-glob: "uv.lock"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version-file: ".python-version"

            - name: Install dependencies
              # Same --no-sources reasoning as the Ruff job: resolve the pinned
              # transportations-library from the index, not the sibling path.
              run: uv sync --all-extras --dev --no-sources

            - name: Run the test suite
              # No continue-on-error. A red suite is the signal this job exists
              # for: a stale expected value sat failing on main unnoticed until
              # 2026-08-18 because nothing ran pytest here.
              run: uv run --no-sources pytest -q
